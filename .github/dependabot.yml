version: 2
updates:
  # sanctify-php is a Haskell (cabal) project. Dependabot has no Haskell
  # ecosystem, so GitHub Actions is the only one it can update here. The
  # former npm, pip and cargo entries had no manifest to read (no
  # package.json, requirements file or Cargo.toml) and failed every run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
